x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ─────────────────────────────────────────
  # NGINX - Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      - WIKI_DOMAIN=${WIKI_DOMAIN}
      - AUTH_DOMAIN=${AUTH_DOMAIN}
      - DOMAIN=${DOMAIN}
      - ATOBRIEF_DOMAIN=${ATOBRIEF_DOMAIN}
      - ASACS_DOMAIN=${ASACS_DOMAIN}
    command: >
      /bin/sh -c "
      echo 'resolver 127.0.0.11 valid=10s ipv6=off;
      client_max_body_size 350M;
      map \$$http_upgrade \$$connection_upgrade {
        default upgrade;
        \"\" close;
      }
      map \$$http_user_agent \$$bad_bot {
        default 0;
        \"~*GPTBot\" 1;
        \"~*Amazonbot\" 1;
        \"~*MJ12bot\" 1;
        \"~*DotBot\" 1;
        \"~*Bytespider\" 1;
        \"~*l9scan\" 1;
        \"~*RootEvidence\" 1;
        \"~*crusader-worker\" 1;
        \"~*Dataprovider\" 1;
      }
      map \$$args \$$scraper_sig {
        default 0;
        \"~*tagfilter=visualeditor\" 1;
        \"~*tagfilter%3Dvisualeditor\" 1;
        \"~*action=feedrecentchanges\" 1;
      }
      limit_req_zone \$$binary_remote_addr zone=wiki:10m rate=5r/s;
      limit_req_zone \$$binary_remote_addr zone=wikiauth:5m rate=1r/s;
      server {
        listen 80;
        server_name '$$WIKI_DOMAIN';
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://\$$host\$$request_uri; }
      }
      server {
        listen 443 ssl;
        server_name '$$WIKI_DOMAIN';
        ssl_certificate /etc/letsencrypt/live/'$$WIKI_DOMAIN'/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/'$$WIKI_DOMAIN'/privkey.pem;
        deny 74.7.227.48;
        deny 74.7.243.248;
        if (\$$bad_bot) { return 403; }
        if (\$$scraper_sig) { return 403; }
        location = /robots.txt {
          add_header Content-Type text/plain;
          return 200 \"User-agent: GPTBot\\nDisallow: /\\nUser-agent: Amazonbot\\nDisallow: /\\n\\nUser-agent: *\\nDisallow: /index.php?\\nDisallow: /api.php\\n\";
        }
        location = /index.php/Special:PluggableAuthLogin {
          limit_req zone=wikiauth burst=3 nodelay;
          set \$$upstream mediawiki;
          proxy_pass http://\$$upstream:80;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-Proto https;
        }
        location / {
          limit_req zone=wiki burst=30 nodelay;
          set \$$upstream mediawiki;
          proxy_pass http://\$$upstream:80;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-Proto https; }
      }
      server {
        listen 80;
        server_name '$$AUTH_DOMAIN';
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://\$$host\$$request_uri; }
      }
      server {
        listen 443 ssl;
        server_name '$$AUTH_DOMAIN';
        ssl_certificate /etc/letsencrypt/live/'$$AUTH_DOMAIN'/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/'$$AUTH_DOMAIN'/privkey.pem;
        location / {
          set \$$upstream casdoor;
          proxy_pass http://\$$upstream:8000;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-Proto https; }
      }
      server {
        listen 80;
        server_name '$$DOMAIN';
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://\$$host\$$request_uri; }
      }
      server {
        listen 443 ssl;
        server_name '$$DOMAIN';
        ssl_certificate /etc/letsencrypt/live/'$$DOMAIN'/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/'$$DOMAIN'/privkey.pem;
        location / {
          set \$$upstream main-website;
          proxy_pass http://\$$upstream:7000;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-Proto https; }
      }
      server {
        listen 80;
        server_name '$$ATOBRIEF_DOMAIN';
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://\$$host\$$request_uri; }
      }
      server {
        listen 443 ssl;
        server_name '$$ATOBRIEF_DOMAIN';
        ssl_certificate /etc/letsencrypt/live/'$$ATOBRIEF_DOMAIN'/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/'$$ATOBRIEF_DOMAIN'/privkey.pem;
        location / {
          set \$$upstream atobrief;
          proxy_pass http://\$$upstream:4000;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header Upgrade \$$http_upgrade;
          proxy_set_header Connection \$$connection_upgrade;
          proxy_set_header X-Forwarded-Proto https; }
      }
      server {
        listen 80;
        server_name '$$ASACS_DOMAIN';
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://\$$host\$$request_uri; }
      }
      server {
        listen 443 ssl;
        server_name '$$ASACS_DOMAIN';
        ssl_certificate /etc/letsencrypt/live/'$$ASACS_DOMAIN'/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/'$$ASACS_DOMAIN'/privkey.pem;
        location / {
          set \$$upstream crc-sync;
          proxy_pass http://\$$upstream:3000;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header Upgrade \$$http_upgrade;
          proxy_set_header Connection \$$connection_upgrade;
          proxy_set_header X-Forwarded-Proto https; }
      }
      ' > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - mediawiki
      - casdoor
      - atobrief
      - crc-sync
    networks:
      - web

  # ─────────────────────────────────────────
  # CERTBOT - Auto SSL
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: certbot
    logging: *default-logging
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - web

  # ─────────────────────────────────────────
  # MARIADB - Shared Database
  # ─────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      WIKI_DB_PASSWORD: ${WIKI_DB_PASSWORD}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # MEDIAWIKI
  # ─────────────────────────────────────────
  mediawiki:
    build: ./mediawiki
    container_name: mediawiki
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mediawiki-images:/var/www/html/images
      - ./mediawiki/LocalSettings.php:/var/www/html/LocalSettings.php:ro
      - ./mediawiki/LocalSettings.perf.php:/var/www/html/LocalSettings.perf.php:ro
      - ./mediawiki/apache/zz-mpm.conf:/etc/apache2/conf-enabled/zz-mpm.conf:ro
      - ./mediawiki/extensions/CasdoorSync:/var/www/html/extensions/CasdoorSync
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - internal
      - web

  # ─────────────────────────────────────────
  # CASDOOR - Auth (SSO)
  # ─────────────────────────────────────────
  casdoor:
    image: casbin/casdoor:latest
    container_name: casdoor
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - casdoor-conf:/conf
      - ./casdoor_entrypoint.sh:/casdoor_entrypoint.sh:ro
    environment:
      CASDOOR_DB_USER: ${CASDOOR_DB_USER}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    entrypoint: [ "/bin/sh", "/casdoor_entrypoint.sh" ]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - internal
      - web

  # ─────────────────────────────────────────
  # Main - Website (Node.js / Express)
  # ─────────────────────────────────────────
  main-website:
    image: ghcr.io/niknam3/sourcedcs/sourcedcs-web:${TAG:-latest}
    container_name: main-website
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=7000
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID}
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT}
      - DISCORD_URL=${DISCORD_URL}
      - WIKI_URL=${WIKI_URL}
      - ATO_URL=${ATO_URL}
      - OLYMPUS_URL=${OLYMPUS_URL}
      - ASACS_URL=${ASACS_URL}
      - GITHUB_URL=${GITHUB_URL}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - APPLY_CHANNEL_ID=${APPLY_CHANNEL_ID}
      - GRADING_CHANNEL_ID=${GRADING_CHANNEL_ID}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET}
      - RELEASE_UPLOAD_TOKEN=${RELEASE_UPLOAD_TOKEN}
      - FLIGHT_PLAN_SERVICE_TOKEN=${FLIGHT_PLAN_SERVICE_TOKEN}
    networks:
      - web
    volumes:
      - sourcedcs-web-data:/app/data

  # ─────────────────────────────────────────
  # ATO BRIEF (Node.js / Express + Socket.IO)
  # ─────────────────────────────────────────
  atobrief:
    image: ghcr.io/niknam3/sourcedcs/atobrief:${TAG:-latest}
    container_name: atobrief
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=4000
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT}
      - ATOBRIEF_CLIENT_ID=${ATOBRIEF_CLIENT_ID}
      - ATOBRIEF_CLIENT_SECRET=${ATOBRIEF_CLIENT_SECRET}
    networks:
      - web

  # ─────────────────────────────────────────
  # CRC-SYNC (crc-desktop multiplayer sync backend)
  # Replaces the retired asacs-link — see crc-sync/ for the service source
  # and root README.md for the architecture. Casdoor-authed; sole gRPC/SRS
  # client to server.sourcedcs.page on behalf of every crc-desktop instance.
  # ─────────────────────────────────────────
  crc-sync:
    image: ghcr.io/niknam3/sourcedcs/crc-sync:${TAG:-latest}
    container_name: crc-sync
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT}
      - CRCSYNC_CLIENT_ID=${CRCSYNC_CLIENT_ID}
      - CRCSYNC_CLIENT_SECRET=${CRCSYNC_CLIENT_SECRET}
      - DCS_GRPC_HOST=${CRCSYNC_DCS_GRPC_HOST:-server.sourcedcs.page:50051}
      - SRS_HOST=${CRCSYNC_SRS_HOST:-server.sourcedcs.page}
      - SRS_PORT=${CRCSYNC_SRS_PORT:-5002}
      - CRCSYNC_SOURCEDCS_WEB_URL=${CRCSYNC_SOURCEDCS_WEB_URL:-http://main-website:7000}
      - FLIGHT_PLAN_SERVICE_TOKEN=${FLIGHT_PLAN_SERVICE_TOKEN}
    networks:
      - web

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: true   # mariadb never exposed to internet

volumes:
  mariadb-data:
  mediawiki-images:
  certbot-webroot:
  certbot-certs:
  casdoor-conf:
  sourcedcs-web-data:
