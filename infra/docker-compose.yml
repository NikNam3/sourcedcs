x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ─────────────────────────────────────────
  # NGINX - Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    environment:
      - WIKI_DOMAIN=${WIKI_DOMAIN}
      - AUTH_DOMAIN=${AUTH_DOMAIN}
      - DOMAIN=${DOMAIN}
      - ATOBRIEF_DOMAIN=${ATOBRIEF_DOMAIN}
      # Neutral name for the crc-sync vhost. ASACS_DOMAIN is the retired asacs_link
      # name; it is still honoured as a fallback so an existing infra/.env keeps working.
      - CRCSYNC_DOMAIN=${CRCSYNC_DOMAIN:-${ASACS_DOMAIN}}
    # No `command:`: the nginx image's entrypoint renders templates/*.template with
    # envsubst into conf.d/ (only the variables set in `environment` above).
    depends_on:
      - mediawiki
      - casdoor
      - atobrief
      - crc-sync
    networks:
      - web

  # ─────────────────────────────────────────
  # CERTBOT - Auto SSL
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: certbot
    logging: *default-logging
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - web

  # ─────────────────────────────────────────
  # MARIADB - Shared Database
  # ─────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      WIKI_DB_PASSWORD: ${WIKI_DB_PASSWORD}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # MEDIAWIKI
  # ─────────────────────────────────────────
  mediawiki:
    build: ./mediawiki
    container_name: mediawiki
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - mediawiki-images:/var/www/html/images
      - ./mediawiki/LocalSettings.php:/var/www/html/LocalSettings.php:ro
      - ./mediawiki/LocalSettings.perf.php:/var/www/html/LocalSettings.perf.php:ro
      - ./mediawiki/apache/zz-mpm.conf:/etc/apache2/conf-enabled/zz-mpm.conf:ro
      - ./mediawiki/extensions/CasdoorSync:/var/www/html/extensions/CasdoorSync
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - internal
      - web

  # ─────────────────────────────────────────
  # CASDOOR - Auth (SSO)
  # ─────────────────────────────────────────
  casdoor:
    image: casbin/casdoor:latest
    container_name: casdoor
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - casdoor-conf:/conf
      - ./casdoor_entrypoint.sh:/casdoor_entrypoint.sh:ro
    environment:
      CASDOOR_DB_USER: ${CASDOOR_DB_USER}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    entrypoint: [ "/bin/sh", "/casdoor_entrypoint.sh" ]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - internal
      - web

  # ─────────────────────────────────────────
  # Main - Website (Node.js / Express)
  # ─────────────────────────────────────────
  main-website:
    image: ghcr.io/niknam3/sourcedcs/sourcedcs-web:${TAG:-latest}
    container_name: main-website
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=7000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID}
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT}
      - DISCORD_URL=${DISCORD_URL}
      - WIKI_URL=${WIKI_URL}
      - ATO_URL=${ATO_URL}
      - OLYMPUS_URL=${OLYMPUS_URL}
      - CRCSYNC_URL=${CRCSYNC_URL:-${ASACS_URL}}
      - GITHUB_URL=${GITHUB_URL}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - APPLY_CHANNEL_ID=${APPLY_CHANNEL_ID}
      - GRADING_CHANNEL_ID=${GRADING_CHANNEL_ID}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET}
      - RELEASE_UPLOAD_TOKEN=${RELEASE_UPLOAD_TOKEN}
      - FLIGHT_PLAN_SERVICE_TOKEN=${FLIGHT_PLAN_SERVICE_TOKEN}
    networks:
      - web
    volumes:
      - sourcedcs-web-data:/app/data

  # ─────────────────────────────────────────
  # ATO BRIEF (Node.js / Express + Socket.IO)
  # ─────────────────────────────────────────
  atobrief:
    image: ghcr.io/niknam3/sourcedcs/atobrief:${TAG:-latest}
    container_name: atobrief
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=4000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT}
      - ATOBRIEF_CLIENT_ID=${ATOBRIEF_CLIENT_ID}
      - ATOBRIEF_CLIENT_SECRET=${ATOBRIEF_CLIENT_SECRET}
      - ATOBRIEF_USMTF_TOKEN=${ATOBRIEF_USMTF_TOKEN}
    networks:
      - web

  # ─────────────────────────────────────────
  # CRC-SYNC (crc-desktop multiplayer sync backend)
  # Replaces the retired asacs-link — see crc-sync/ for the service source
  # and root README.md for the architecture. Casdoor-authed; sole gRPC/SRS
  # client to server.sourcedcs.page on behalf of every crc-desktop instance.
  # ─────────────────────────────────────────
  crc-sync:
    image: ghcr.io/niknam3/sourcedcs/crc-sync:${TAG:-latest}
    container_name: crc-sync
    restart: unless-stopped
    logging: *default-logging
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT}
      - CRCSYNC_CLIENT_ID=${CRCSYNC_CLIENT_ID}
      - CRCSYNC_CLIENT_SECRET=${CRCSYNC_CLIENT_SECRET}
      - DCS_GRPC_HOST=${CRCSYNC_DCS_GRPC_HOST:-server.sourcedcs.page:50051}
      - DCS_GRPC_POLL_RATE=${DCS_GRPC_POLL_RATE:-1}
      - DCS_GRPC_MAX_BACKOFF=${DCS_GRPC_MAX_BACKOFF:-5}
      - SRS_HOST=${CRCSYNC_SRS_HOST:-server.sourcedcs.page}
      - SRS_PORT=${CRCSYNC_SRS_PORT:-5002}
      - CRCSYNC_COALITION=${CRCSYNC_COALITION:-3}
      - CRCSYNC_SOURCEDCS_WEB_URL=${CRCSYNC_SOURCEDCS_WEB_URL:-http://main-website:7000}
      - FLIGHT_PLAN_SERVICE_TOKEN=${FLIGHT_PLAN_SERVICE_TOKEN}
      # Terrain masking for the radar picture is server-side now (crc-sync's
      # docs/adr/0044), so the DEM tiles it samples are fetched here. Without a
      # key the picture still works and terrain simply masks nothing — every
      # radar sees to its full range — which is logged once at startup.
      - CRCSYNC_MAPTILER_KEY=${CRCSYNC_MAPTILER_KEY:-}
      - CRCSYNC_TERRAIN_CACHE_DIR=/app/state/terrain-cache
    volumes:
      # EVERYTHING crc-sync writes, and nothing else. Mounted at /app/state,
      # deliberately NOT over /app/config (shipped squadron data: facility,
      # airspace, sensor specs) and NOT over /app/data (shipped
      # reference tables: the airfield name-to-ICAO map). A named volume starts
      # empty, so mounting it over either would shadow those files and present
      # as every one of them having reset to defaults.
      #
      # So the service splits the two (crc-sync/src/state-paths.js):
      # config/ and data/ hold shipped defaults and reference tables, state/ holds
      # runtime state, and a read prefers state/ and falls back to the shipped
      # default. Without this volume a `docker compose up -d` that recreated the
      # container discarded the EFSP Board, the whole Mutation audit log, the
      # squadron squawk map, the theater settings, the per-airport ATIS config
      # and the airspace definitions — despite docs/adr/0002 making the Board
      # durable. See docs/adr/0048.
      - crc-sync-state:/app/state
    networks:
      - web

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
    internal: true   # mariadb never exposed to internet

volumes:
  mariadb-data:
  mediawiki-images:
  certbot-webroot:
  certbot-certs:
  casdoor-conf:
  sourcedcs-web-data:
  crc-sync-state:
