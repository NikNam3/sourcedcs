# perf's own server, inside its container (docs/wip/TOLD.md, "Deployment and operations"). The stack's nginx
# (infra/nginx/templates/default.conf.template) terminates TLS for PERF_DOMAIN and proxies here on port 80.
# Same paths as scripts/serve.ts: / → /f16/, /f16/data/… → data/…, /f16/… → web/….
server {
  listen 80;
  server_name _;
  root /usr/share/perf;
  index index.html;

  # Redirects keep the client's scheme and host: behind the TLS proxy an absolute one would say http://perf:80.
  absolute_redirect off;
  server_tokens off;

  # no-cache with ETags: every load revalidates, so code and data never mix across a deploy (a 304 costs little).
  etag on;
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  gzip on;
  gzip_types application/json text/css application/javascript text/javascript image/svg+xml;
  gzip_min_length 1024;

  location = / { return 302 /f16/; }
  location = /f16 { return 302 /f16/; }
  location /f16/ {
    limit_except GET { deny all; }
    try_files $uri $uri/ =404;
  }
  location / { return 404; }
}
