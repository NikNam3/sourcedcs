# Figure B2-2, Takeoff Speed (CG 35 % MAC, 10 deg pitch attitude). Coordinates are PDF points,
# from perf/prototype/extraction/extract.py and imgs.py, checked by overlay.
id: B2-2
figure: B2-2
sheet: null
dataset: f16c-f110-129
title: Takeoff Speed
engine: F110-GE-129
page_index: 284                 # 0-based
