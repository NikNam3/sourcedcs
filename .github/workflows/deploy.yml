name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push atobrief Docker Image", "Build and Push sourcedcs-web Docker Image", "Build and Push crc-sync Docker Image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      skip_protocol_gate:
        description: 'Human only: recreate crc-sync even if its wire protocol differs from the published crc-desktop release (infra/RUNBOOK.md, "Wire protocol and the deploy gate")'
        type: boolean
        default: false

concurrency:
  # One deploy at a time per branch, queued rather than dropped. Without
  # this, several of these can trigger in quick succession (e.g. a burst of
  # crc-desktop-v* tags, each firing crc-sync-docker.yml -> this workflow)
  # and run concurrently against the same server, racing the same `docker
  # compose up -d` recreate step -- this once left a stale temp-renamed
  # container blocking every subsequent deploy with a name conflict.
  group: deploy-${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'dev' && 'dev' || 'main' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'dev')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev'))
    environment: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'development' }}
    
    steps:
      # The wire protocol gate (crc-sync docs/adr/0103). It decides only whether crc-sync is RECREATED by this deploy, and only
      # on main (dev has no published release to compare with). It never fails the job: the git pull and every other image
      # still deploy, and an unreachable releases API warns and lets crc-sync through (S-VERSION1).
      - name: Check out the deployed commit (full history and tags)
        if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'main' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Wire protocol gate
        id: gate
        if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'main' }}
        env:
          SKIP_PROTOCOL_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_protocol_gate && 'true' || 'false' }}
        run: bash .github/scripts/protocol-gate.sh

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          HOLD_CRC_SYNC: ${{ steps.gate.outputs.hold }}
        with:
          envs: HOLD_CRC_SYNC
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.PATH }}
            git pull --ff-only
            cd infra
            export TAG=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'dev' && 'dev' || 'latest' }}
            # Only pull the images we actually publish. Pulling every service
            # (mariadb, casdoor, certbot, nginx) on every deploy means one
            # transient registry hiccup on a completely unrelated, unchanged
            # base image aborts the whole deploy under set -e -- as happened
            # here with a mariadb:11 TLS handshake timeout blocking a nginx
            # config change that had nothing to do with mariadb.
            if [ "${HOLD_CRC_SYNC:-false}" = "true" ]; then
              # The wire protocol gate held crc-sync (see the "Wire protocol gate" step's error). Deploy everything else and
              # leave the running crc-sync alone: no pull, no recreate.
              echo "crc-sync is HELD by the wire protocol gate; deploying every other service."
              docker compose pull main-website atobrief
              docker compose up -d --remove-orphans --no-deps $(docker compose config --services | grep -vx crc-sync)
            else
              docker compose pull main-website atobrief crc-sync
              docker compose up -d --remove-orphans
            fi
