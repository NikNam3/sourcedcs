name: Build and Push perf Docker Image

# test: lint, format, types, build, data check, unit tests, then the Playwright smoke spec (perf/e2e/, TOLD.md 1.8),
# on every push touching perf/. build-and-push: only on main, dev and v* tags, like the other docker-image services;
# deploy.yml listens to this workflow's name. CI never runs the extractor: the manual PDF is not in the repo.
# crc-sync/src/altimetry.js is in the path filter for the pressure-altitude parity test (ADR 0148).
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - 'perf/**'
      - 'crc-sync/src/altimetry.js'
      - '.github/workflows/perf-docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/perf

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: perf
        run: npm ci

      - name: Lint
        working-directory: perf
        run: npm run lint

      - name: Format check
        working-directory: perf
        run: npm run format:check

      - name: Type check
        working-directory: perf
        run: npm run typecheck

      - name: Build
        working-directory: perf
        run: npm run build

      - name: Generated types up to date
        working-directory: perf
        run: npm run types:check

      - name: Data check (schema and manifest hashes)
        working-directory: perf
        run: npm run data:check

      - name: Tests (90 % line coverage on src/core)
        working-directory: perf
        run: npm test

      - name: Install Playwright Chromium
        working-directory: perf
        run: npx playwright install --with-deps chromium

      - name: Smoke spec (Playwright, Chromium)
        working-directory: perf
        run: npm run e2e

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # R3-37: a v* release tag must be on main.
      - name: Refuse a tag whose commit is not on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error title=Release refused::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Merge to main first, then tag from main."
            exit 1
          }

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./perf
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
