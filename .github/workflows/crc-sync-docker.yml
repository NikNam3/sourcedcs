name: Build and Push crc-sync Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
    paths:
      - 'crc-sync/**'
      - '.github/workflows/crc-sync-docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/crc-sync

jobs:
  # The deploy gate (docs/adr/0103, S3-5): no image is built unless both unit suites pass. crc-desktop's suite is here
  # too because its parity test reads crc-sync's wire-protocol.js. A workflow_dispatch from the crc-desktop release runs it too.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          (cd crc-sync && npm ci)
          (cd crc-desktop && npm ci)
          (cd crc-desktop/app && npm ci)

      - name: crc-sync tests
        working-directory: crc-sync
        run: npm test

      - name: crc-desktop tests
        working-directory: crc-desktop
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # R3-37: a v* release tag must be on main.
      - name: Refuse a tag whose commit is not on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error title=Release refused::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Merge to main first, then tag from main."
            exit 1
          }

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./crc-sync
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
