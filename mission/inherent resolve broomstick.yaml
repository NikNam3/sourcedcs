spins:
  version: '1.0'
  sections:
  - title: C1 — COMMAND & CONTROL
    entries:
    - heading: C1.1 — Tactical Control
    - label: PRIMARY AWACS
      value: MAGIC1 / 265.100 MHz
    - label: SECONDARY AWACS
      value: MAGIC2 / 334.150 MHz
    - heading: C1.2 — Airspace Control
    - value: SCT, via LTAG MTMA and CVN-75
    - heading: C1.3 — Package Lead
    - label: PACKAGE LEAD
      value: SHADOW11
    - heading: C1.4 — Strike Lead
    - label: STRIKE LEAD
      value: BOLO11
  - title: C3 — IFF / SIF
    note: Squawk assigned Mode 3 code. Mode 4 mandatory.
    table:
      headers:
      - MSN
      - MODE
      - CODE
      rows:
      - - '6011'
        - '3'
        - '4811'
      - - '6012'
        - '3'
        - '4821'
      - - '6013'
        - '3'
        - '4831'
      - - '6014'
        - '3'
        - '4841'
  - title: C4 — RULES OF ENGAGEMENT
    entries:
    - heading: C4.1 — PID
    - label: PID SOURCES
      value: NCTR / radar profile, Correlated track from CRC/AWACS, Visual ID (VID)
    - bullet: Unidentified aircraft departing known mixed-use or adversary-controlled bases are NOT automatically hostile
    - heading: C4.2 — BVR
    - bullet: Weapons free against aircraft declared HOSTILE or demonstrating hostile act
    - bullet: Aircraft operating third-party deconfliction agreements require higher authority clearance unless self-defence
    - heading: C4.3 — SFC ATTACK
    - bullet: Weapons release authorized only on assigned ATO targets
    - bullet: Dynamic targeting requires CAOC approval unless self-defence
    - bullet: Collateral damage estimate 1-3 delegated; higher requires CAOC approval
    - heading: C4.4 — Civilian Traffic
    - value: NO FACTOR
    note: BVR weapons authorised only after PID or declaration by controlling agency.
  - title: C5 — EXECUTION
    entries:
    - heading: C5.6011 — SHADOW (SEAD)
    - label: OBJECTIVE
      value: Degrade TS-024 Radar effectives with Maximum Effort.
    - bullet: Reactive SEAD permitted against emitting threat systems tracking package aircraft
    - heading: C5.6012 — HAT (OCA-FTR)
    - label: OBJECTIVE
      value: Deny adversary air interference within package airspace.
    - label: ORBIT
      value: N35°05.098 E035°44.098 AG27 090 10nm
    - value: 'Priority of effort:'
    - bullet: 1. Aircraft targeting MSN 6011 aircraft
    - bullet: 2. Aircraft supporting TS-024 Engagement
    - bullet: 3. All other hostile air contacts
    - heading: C5.6013 — COWBOY (ESCORT)
    - label: OBJECTIVE
      value: Deny adversary air interference on MSN 6014
    - label: TARGETING RANGE
      value: 65NM
    - heading: C5.6014 — BOLO (DEAD)
    - label: PRIMARY OBJECTIVE
      value: Destruction of TS-024R
    - label: SECONDARY OBJECTIVE
      value: Destruction of TS-024S
    - heading: C5.9001 — SHELL (GAS)
    - label: TACAN
      value: 37X
    - heading: C5.9002 — ARCO (GAS)
    - label: TACAN
      value: 38X
  - title: C7 — LOST COMMS
    entries:
    - heading: C7.1 — Loss of AWACS
    - bullet: Default to package commander control
    - bullet: Abort mission if communication cannot be restored within 5 minutes
    - heading: C7.2 — Loss of Package Comms
    - bullet: Continue mission if task and ROE remain clear
    - bullet: Abort in case of degraded situation awareness
    - heading: C7.3 — Loss of Intraflight Comms
    - bullet: Continue assigned task
    - bullet: Reestablish communication post target if feasible
    - bullet: Abort mission if communication cannot be reestablished
  - title: C8 — ABORT CRITERIA
    entries:
    - bullet: Target PID cannot be confirmed
    - bullet: Collateral damage risk exceeds authorization
    - bullet: Fuel state prevents safe recovery
    - bullet: Supporting mission unsuccessful and threat unacceptable
    - bullet: Major technical faults
  - title: C9 — SEARCH AND RESCUE
    entries:
    - value: NOT SIMULATED
  - title: C10 — AUTHENTICATION
    entries:
    - label: AUTHENTICATION
      value: Daily authentication table per COMSEC
  - title: C11 — SAFETY
    entries:
    - label: MINIMUM SEPARATION
      value: 5NM / 2000ft between coalition aircraft outside tactical formation
