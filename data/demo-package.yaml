spins:
  version: '3.0'
  sections:

  - title: C1 — COMMAND & CONTROL
    entries:
    - {label: PRIMARY AWACS,   value: "SCREWTOP / 260.0 MHz", style: green}
    - {label: SECONDARY AWACS, value: "SCREWTOP / 134.0 MHz"}
    - {label: AIRSPACE CTRL,   value: Via OMAM MTMA}
    - {label: PACKAGE LEAD,    value: FALCON5, style: amber}
    - {label: STRIKE LEAD,     value: DRAGON6, style: amber}

  - title: C3 — IFF / SIF
    note: Squawk assigned code. M4 mandatory before departure.
    table:
      headers: [MSN, MODE, CODE]
      cell_classes: [~, ~, iff-code]
      rows:
      - [MSN3266, 3, '4821']
      - [MSN3267, 3, '4811']
      - [MSN3268, 3, '4831']
      - [AA7511,  3, '4841']

  - title: C4 — RULES OF ENGAGEMENT
    entries:
    - {label: PID REQUIRED,    value: "YES — required before weapons release", style: red}
    - {bullet: "NCTR / radar profile"}
    - {bullet: "Correlated track from CRC/AWACS"}
    - {bullet: "Visual ID (VID)"}
    - {bullet: "Unidentified aircraft departing known mixed-use or adversary-controlled bases are NOT automatically hostile.", style: amber}
    - {label: BVR,             value: "AUTHORIZED — after PID or controller declaration", style: amber}
    - {label: SFC ATTACK,      value: Assigned ATO targets only}
    - {label: DYNAMIC TGT,     value: Requires CAOC approval unless self-defence}
    - {label: COLLATERAL DAM., value: "Levels 1-3 delegated; higher → CAOC approval"}
    - {label: CIVILIAN TRAFFIC, value: No Factor}

  - title: C5 — EXECUTION OBJECTIVES
    entries:
    - {heading: MSN3267}
    - {value: Degrade TS-024 radar effectiveness with Maximum Effort}
    - {bullet: Reactive SEAD permitted against emitting threat systems tracking package aircraft}
    - {heading: MSN3266}
    - {value: Deny adversary air interference within package airspace}
    - {bullet: "1. Aircraft targeting MSN3267"}
    - {bullet: "2. Aircraft supporting TS-024 engagement"}
    - {bullet: "3. All other hostile air contacts"}
    - type: orbit_reference
      coords: N25°30'00" E055°30'00"
      anchor: TRACK-1
      bearing_deg: 45
      distance_nm: 15
      style: blue
    - {heading: MSN3268}
    - {value: Deny adversary air interference on AA7511}
    - {bullet: "Targeting range: 65nm"}
    - {heading: AA7511}
    - {value: Destruction of TS-024R}
    - {bullet: "Secondary: Destruction of TS-024S"}

  - title: C7 — LOST COMMS
    entries:
    - {label: "LOSS AWACS — ACTION", value: Default to package commander control}
    - {label: "LOSS AWACS — ABORT",  value: Abort mission if communication cannot be restored within 5 minutes, style: red}
    - {label: "LOSS PACKAGE — ACTION", value: Continue mission if task and ROE remain clear}
    - {label: "LOSS PACKAGE — ABORT",  value: Abort in case of degraded situation awareness, style: red}
    - {label: LOSS INTRAFLIGHT, value: Continue assigned task. Reestablish communication post-target if feasible.}
    - {label: ABORT,            value: Abort mission if communication cannot be reestablished, style: red}

  - title: C8 — ABORT CRITERIA
    entries:
    - {bullet: Target PID cannot be confirmed}
    - {bullet: Collateral damage risk exceeds authorization}
    - {bullet: Fuel state prevents safe recovery}
    - {bullet: Supporting mission unsuccessful and threat unacceptable}
    - {bullet: Major technical faults}

  - title: C9 — SEARCH AND RESCUE
    entries:
    - {label: STATUS, value: Not Simulated}

  - title: C11 — SAFETY
    entries:
    - {label: MIN SEPARATION, value: "5NM / 2000ft between coalition aircraft outside tactical formation", style: amber}

